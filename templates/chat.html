<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKA AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

/* LAYOUT */
.main {
  display: flex;
  height: 100dvh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #111;
  padding: 20px;
  border-right: 1px solid #333;
}

/* CHAT AREA */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* TOP */
.topbar{
  height:65px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-bottom:1px solid #333;
}

.top-logo{
  width:42px;
  height:42px;
  object-fit:contain;
}


/* CHAT */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* MESSAGE */
.message {
  max-width: 75%;
  padding: 10px 14px;
  border-radius: 15px;
  font-size: 14px;
}

.user {
  background: #4a8cff;
  align-self: flex-end;
}

.ai {
background:#222;
align-self:flex-start;
display:flex;
align-items:center;
justify-content:center;
}

/* INPUT */
.input-box {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 10px;
  padding: 10px;
  border-top: 1px solid #333;
  background: #0b0b0b;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 20px;
  border: none;
  outline: none;
  background: #1a1a1a;
  color: white;
}

button {
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  background: #4a8cff;
  color: white;
}

.typing-logo{
  width:38px;
  height:38px;
  animation:heartbeat 1.3s infinite;
}

@keyframes heartbeat{

0%{
transform:scale(1);
filter:drop-shadow(0 0 0px #6c5cff);
}

25%{
transform:scale(1.1);
filter:drop-shadow(0 0 8px #6c5cff);
}

50%{
transform:scale(1);
filter:drop-shadow(0 0 16px #6c5cff);
}

75%{
transform:scale(1.1);
filter:drop-shadow(0 0 8px #6c5cff);
}

100%{
transform:scale(1);
filter:drop-shadow(0 0 0px #6c5cff);
}

}

.typing span {
  width: 6px;
  height: 6px;
  background: #aaa;
  border-radius: 50%;
  animation: blink 1s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%,100% {opacity:0.2;}
  50% {opacity:1;}
}

/* MOBILE */
@media(max-width:768px){
  .sidebar {display:none;}
  .message {max-width:85%;}
}
</style>
</head>

<body>

<div class="main">

  <div class="sidebar">
    <h2>EKA AI</h2>
  </div>

  <div class="chat-area">

<div class="topbar">
    <img src="/static/logo.png" class="top-logo">
</div>

    <div id="chat"></div>

    <div class="input-box">
      <input id="prompt" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>

<script>
async function sendMessage() {
  let input = document.getElementById("prompt");
  let msg = input.value.trim();
  if(!msg) return;

  let chat = document.getElementById("chat");

  let user = document.createElement("div");
  user.className = "message user";
  user.innerText = msg;
  chat.appendChild(user);

  input.value="";
  chat.scrollTop = chat.scrollHeight;

  let typing = document.createElement("div");
  typing.className = "message ai";
  typing.innerHTML = `
<img src="/static/logo.png" class="typing-logo">
`;
  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

  let res = await fetch("/ask", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt:msg})
  });

  let data = await res.json();

  typing.remove();

  let ai = document.createElement("div");
  ai.className = "message ai";
  ai.innerText = data.response;
  chat.appendChild(ai);

  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
